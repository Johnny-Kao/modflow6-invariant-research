name: MF-10 native invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: Baseline native oracle
        run: python research/mf10_native.py build/src/mf6 baseline
      - name: Apply candidate correction (runner only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/Model/GroundWaterFlow/gwf-sfr.f90")
          s=p.read_text()
          old="a = this%calc_surface_area_wet(n, d)\n        this%qauxcbc(1) = a * d"
          new="a = this%calc_area_wet(n, d)\n        this%qauxcbc(1) = a * this%length(n)"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          meson compile -C build src/mf6:executable
      - name: Corrected native oracle
        run: python research/mf10_native.py build/src/mf6 corrected
