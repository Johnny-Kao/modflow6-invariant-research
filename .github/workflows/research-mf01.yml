name: MF-11 native invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: Baseline native oracle
        run: python research/mf11_native.py build/src/mf6 baseline
      - name: Apply candidate correction (runner only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/Model/GroundWaterFlow/gwf-npf.f90")
          s=p.read_text()
          a="hy = hy11\n      if (this%ik22 > 0) then"
          b="hy = hy11\n      if (this%ik22 > 0 .or. this%iangle2 > 0) then"
          assert s.count(a)==1
          p.write_text(s.replace(a,b))
          PY
          meson compile -C build src/mf6:executable
      - name: Corrected native oracle
        run: python research/mf11_native.py build/src/mf6 corrected
