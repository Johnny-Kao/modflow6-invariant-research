name: MF-01 native invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: Baseline physical inventory
        run: python research/npfa_mass.py build/src/mf6 baseline
      - name: Candidate refresh of default saturation (runner only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/Model/GroundWaterFlow/gwf-npf.f90")
          s = p.read_text()
          a = "    ! -- Calculate the flow across each cell face and store in flowja"
          assert s.count(a) == 1
          s = s.replace(a, "    call this%default_form%cf(0)\n    !\n" + a)
          p.write_text(s)
          PY
          meson compile -C build src/mf6:executable
      - name: Corrected physical inventory
        run: python research/npfa_mass.py build/src/mf6 corrected
