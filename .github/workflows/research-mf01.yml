name: MF-12 native groundwater wetting direction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: Baseline native oracle
        run: python research/mf12_native.py build/src/mf6 baseline
      - name: Apply candidate correction (runner only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/Model/GroundWaterFlow/gwf-npf.f90")
          s = p.read_text()
          a = "        call this%rewet_check(kiter, n, hnew(m), this%ibound(m), ihc, hnew, &"
          assert s.count(a) == 1
          p.write_text(s.replace(a, "        if (ihc == C3D_VERTICAL .and. m < n) cycle\n" + a))
          PY
          meson compile -C build src/mf6:executable
      - name: Corrected native oracle
        run: python research/mf12_native.py build/src/mf6 corrected
