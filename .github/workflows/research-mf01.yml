name: MF-01 native invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: NPF consistency measurements
        run: python research/npf_core_consistency.py build/src/mf6
