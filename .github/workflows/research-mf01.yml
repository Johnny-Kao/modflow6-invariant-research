name: MF-11 native confined storage retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal build dependencies
        run: |
          python -m pip install 'meson>=1.7' ninja flopy
          gfortran --version
      - name: Build original source
        run: |
          meson setup build -Dunit_tests=disabled -Dbuildtype=debugoptimized
          meson compile -C build src/mf6:executable
      - name: Baseline native oracle
        run: python research/mf11_native.py build/src/mf6 baseline
      - name: Apply candidate correction (runner only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/Model/GroundWaterFlow/gwf-sto.f90")
          s = p.read_text()
          a = "  subroutine sto_ad(this)\n    ! -- modules\n    use TdisModule, only: kstp"
          b = "    if (this%integratechanges /= 0 .and. kstp > 1) then"
          assert s.count(a) == 1 and s.count(b) == 1
          s = s.replace(a, a + "\n    use SimVariablesModule, only: iFailedStepRetry")
          s = s.replace(b, "    if (this%integratechanges /= 0 .and. kstp > 1 .and. &\n        iFailedStepRetry == 0) then")
          p.write_text(s)
          PY
          meson compile -C build src/mf6:executable
      - name: Corrected native oracle
        run: python research/mf11_native.py build/src/mf6 corrected
